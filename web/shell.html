<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ps2-web-recomp</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #d8d8dc; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #000; }
  #bar { display: flex; gap: 16px; align-items: center; padding: 6px 12px; background: #141418; border-top: 1px solid #222; }
  #status { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats { font-variant-numeric: tabular-nums; color: #9ad; }
  select { background: #2a3a55; color: #fff; border: 0; padding: 5px 8px; border-radius: 4px; }
  button { background: #2a3a55; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; }
  #panel { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; text-align: center; }
  #help { margin: 0; line-height: 1.5; color: #e8c37a; }
  .controls { display: none; }
  body.touch { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  body.touch #stage { flex: none; width: 100%; aspect-ratio: 4 / 3; max-height: 60vh; }
  body.touch .controls {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "mid mid" "left right";
    gap: 10px 8px; align-content: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    --ctl: #1d2433; --ctl-on: #4a6aa5; --ctl-line: #34405a; --ctl-text: #dfe6f3;
  }
  .cluster { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cluster.left { grid-area: left; } .cluster.right { grid-area: right; }
  .cluster.mid { grid-area: mid; flex-direction: row; gap: 10px; justify-self: center; }
  .shoulders { display: flex; gap: 8px; width: 100%; max-width: 160px; }
  .ctl {
    display: flex; align-items: center; justify-content: center; color: var(--ctl-text);
    background: var(--ctl); border: 1px solid var(--ctl-line); font-weight: 600;
  }
  .ctl.on, .dpad span.on { background: var(--ctl-on); }
  .shoulder { flex: 1; height: 38px; border-radius: 12px 12px 6px 6px; }
  .small { padding: 0 12px; height: 30px; border-radius: 15px; font-size: 12px; font-weight: 500; }
  .face { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
  .face .ctl { border-radius: 50%; font-size: 20px; }
  .face .tri { grid-area: 1 / 2; } .face .sq { grid-area: 2 / 1; }
  .face .ci { grid-area: 2 / 3; } .face .cr { grid-area: 3 / 2; }
  .dpad { width: 120px; height: 120px; display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); }
  .dpad span {
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    color: var(--ctl-text); background: var(--ctl); border: 1px solid var(--ctl-line);
  }
  .dpad .up { grid-area: 1 / 2; border-radius: 8px 8px 0 0; } .dpad .down { grid-area: 3 / 2; border-radius: 0 0 8px 8px; }
  .dpad .left { grid-area: 2 / 1; border-radius: 8px 0 0 8px; } .dpad .right { grid-area: 2 / 3; border-radius: 0 8px 8px 0; }
  .dpad .hub { grid-area: 2 / 2; }
  .stick { position: relative; width: 120px; height: 120px; border-radius: 50%; background: var(--ctl); border: 1px solid var(--ctl-line); }
  .knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--ctl-on); border: 1px solid var(--ctl-line);
  }
  body.touch.hide-controls .controls { display: none; }
  #exit-fullscreen {
    display: none; position: fixed; z-index: 3; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
    padding: 4px 10px; font-size: 12px; background: rgba(255, 255, 255, 0.15); opacity: 0.4;
  }
  #exit-fullscreen:hover { opacity: 0.9; }
  body.fullscreen { background: #000; }
  body.fullscreen #bar { display: none; }
  body.fullscreen #exit-fullscreen { display: block; }

  /* Settings Modal and Enhancements */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
  }
  .modal-backdrop[hidden] { display: none !important; }
  .modal-card {
    background: #141724; border: 1px solid #2d3852; border-radius: 12px;
    width: 90%; max-width: 480px; box-shadow: 0 16px 48px rgba(0,0,0,0.85);
    display: flex; flex-direction: column; overflow: hidden; animation: popIn 0.15s ease-out;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid #20273a; background: #181d2f;
  }
  .modal-header h2 { margin: 0; font-size: 15px; font-weight: 600; color: #fff; }
  .close-btn { background: transparent; border: 0; color: #9ab; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
  .close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: 80vh; overflow-y: auto; }
  .setting-group { display: flex; flex-direction: column; gap: 6px; }
  .setting-group label { font-size: 12px; color: #9ab; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .setting-group select { width: 100%; padding: 7px 10px; background: #1c2333; border: 1px solid #2e3a52; border-radius: 6px; color: #fff; }
  .btn-action { background: #253147; color: #fff; border: 1px solid #3b4d70; padding: 8px 12px; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .btn-action:hover { background: #354769; }
  .btn-primary { background: #3d68b2; border-color: #4f80d4; }
  .btn-primary:hover { background: #4d7ecf; }
  .toggle-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #dfe6f3; font-weight: normal !important; text-transform: none !important; }
  .toast {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    background: #1c273c; border: 1px solid #3c4f73; color: #fff; padding: 8px 16px;
    border-radius: 20px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 1000; pointer-events: none; transition: opacity 0.2s;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="touch" class="controls" aria-hidden="true">
  <div class="cluster left">
    <div class="shoulders"><div class="ctl shoulder" data-btn="256">L2</div><div class="ctl shoulder" data-btn="1024">L1</div></div>
    <div class="dpad" data-dpad>
      <span class="up" data-dir="16">▲</span><span class="left" data-dir="128">◀</span><span class="hub"></span>
      <span class="right" data-dir="32">▶</span><span class="down" data-dir="64">▼</span>
    </div>
    <div class="stick" data-stick><div class="knob" id="knob"></div></div>
  </div>
  <div class="cluster mid">
    <div class="ctl small" data-btn="1">Select</div>
    <div class="ctl small" data-btn="8">Start</div>
  </div>
  <div class="cluster right">
    <div class="shoulders"><div class="ctl shoulder" data-btn="2048">R1</div><div class="ctl shoulder" data-btn="512">R2</div></div>
    <div class="face">
      <div class="ctl tri" data-btn="4096">△</div>
      <div class="ctl sq" data-btn="32768">□</div>
      <div class="ctl ci" data-btn="8192">○</div>
      <div class="ctl cr" data-btn="16384">✕</div>
    </div>
  </div>
</div>
<div id="bar"><span id="status">Loading…</span><span id="stats"></span>
  <select id="scale" aria-label="Resolution" title="Internal resolution, the page reloads to apply it">
    <option value="1">640×512</option>
    <option value="2">1280×1024</option>
    <option value="3">1920×1536</option>
  </select>
  <button id="controls-toggle" type="button" hidden>Hide controls</button>
  <button id="export-card" type="button" title="Download the memory card in slot 1 as a .ps2 file">Export card</button>
  <button id="import-card" type="button" title="Put a .ps2 memory card file in slot 1">Import card</button>
  <input id="import-file" type="file" accept=".ps2" hidden>
  <button id="settings-btn" type="button" title="Settings & Enhancements">⚙ Settings</button>
  <button id="fullscreen" type="button" title="Fullscreen (F or double click)">Fullscreen</button></div>
<button id="exit-fullscreen" type="button">Exit fullscreen</button>

<div id="settings-modal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <div class="modal-header">
      <h2>⚙ Settings & Enhancements</h2>
      <button id="settings-close" class="close-btn" type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-group">
        <label>Aspect Ratio</label>
        <select id="aspect-select">
          <option value="4:3">4:3 (Original PS2)</option>
          <option value="16:9">16:9 (Widescreen)</option>
          <option value="fill">Fill (Stretched)</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Video Shader / Filter</label>
        <select id="shader-select">
          <option value="sharp">Sharp (Original Pixel Perfect)</option>
          <option value="bilinear">Smooth (Bilinear Filtering)</option>
          <option value="crt">CRT TV (Scanlines)</option>
          <option value="vibrant">Vibrant Colors (Boost)</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Master Audio Volume</label>
        <div style="display:flex;align-items:center;gap:12px">
          <input type="range" id="volume-slider" min="0" max="100" value="100" style="flex:1">
          <span id="volume-label" style="min-width:36px;font-variant-numeric:tabular-nums;text-align:right">100%</span>
        </div>
      </div>
      <div class="setting-group">
        <label>Fault-Tolerant Miss Mode</label>
        <label class="toggle-label">
          <input type="checkbox" id="relax-misses-check">
          <span>Relax Missing Code (Prevent Hard Crashes)</span>
        </label>
      </div>
      <div class="setting-group">
        <label>Emulation Control</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="btn-quick-save" type="button" class="btn-action btn-primary">💾 Quick Save State</button>
          <button id="btn-quick-load" type="button" class="btn-action btn-primary">⚡ Quick Load State</button>
          <button id="btn-pause-emu" type="button" class="btn-action">⏸ Pause Game</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Diagnostics & Compatibility</label>
        <button id="btn-compat-report" type="button" class="btn-action">📋 Export Compatibility Report</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay"><div id="panel"><p id="help" hidden></p><button id="start" disabled>Loading…</button></div></div>
<script>
const statusEl = document.getElementById('status');
const CARD_DIR = '/memcard', CARD_FILE = '/memcard/Mcd001.ps2', CARD_BYTES = 8650752;
let noteTimer = 0, noteRestore = '';
function note(text) {
  if (!noteTimer) noteRestore = statusEl.textContent;
  clearTimeout(noteTimer);
  statusEl.textContent = text;
  noteTimer = setTimeout(() => {
    statusEl.textContent = noteRestore;
    noteTimer = 0;
  }, 5000);
}
let cardTimer = 0;
function storeCard(then) {
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => {
    try {
      FS.syncfs(false, (err) => {
        if (err) console.warn('memory card: could not write browser storage', err);
        if (then) then();
      });
    } catch (e) {
      if (then) then();
    }
  }, 300);
}
document.getElementById('export-card').addEventListener('click', () => {
  let data = null;
  try { data = FS.readFile(CARD_FILE); } catch (e) {}
  if (!data) {
    note('Nothing saved on the memory card yet');
    return;
  }
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
  link.download = 'Mcd001.ps2';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 10000);
});
const importInput = document.getElementById('import-file');
document.getElementById('import-card').addEventListener('click', () => importInput.click());
importInput.addEventListener('change', async () => {
  const file = importInput.files[0];
  importInput.value = '';
  if (!file) return;
  if (file.size !== CARD_BYTES) {
    note('That is not an 8 MB PS2 memory card image (' + CARD_BYTES + ' bytes)');
    return;
  }
  const data = new Uint8Array(await file.arrayBuffer());
  if (new TextDecoder().decode(data.subarray(0, 28)) !== 'Sony PS2 Memory Card Format ') {
    note('That file is not a formatted PS2 memory card');
    return;
  }
  if (!confirm('Replace the memory card in slot 1 with ' + file.name + '? The page reloads to use it.')) return;
  try {
    FS.writeFile(CARD_FILE, data);
  } catch (e) {
    note('Import failed: ' + e.message);
    return;
  }
  storeCard(() => location.reload());
});
const statsEl = document.getElementById('stats');
const canvas = document.getElementById('canvas');
const params = new URLSearchParams(location.search);

function missingFeatures() {
  const header = [0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1, 0, 10];
  const accepts = (body) => {
    try {
      return WebAssembly.validate(new Uint8Array(header.concat([body.length + 2, 1, body.length], body)));
    } catch (e) {
      return false;
    }
  };
  const missing = [];
  if (!window.crossOriginIsolated) missing.push('cross-origin isolation (COOP and COEP headers)');
  if (typeof WebAssembly.Suspending !== 'function') missing.push('WebAssembly JSPI');
  if (!accepts([0, 0x1F, 0x40, 0, 0x0B, 0x0B])) missing.push('WebAssembly exception handling (try_table)');
  if (!accepts([0, 0x12, 0, 0x0B])) missing.push('WebAssembly tail calls');
  if (!accepts([0, 0xFD, 0x0C].concat(new Array(16).fill(0), [0x1A, 0x0B]))) missing.push('WebAssembly SIMD');
  return missing;
}
const missing = missingFeatures();

const touchRoot = document.getElementById('touch'), knob = document.getElementById('knob');
let touchPad = { buttons: 0, x: 0, y: 0, stick: false };
const fingers = new Map();
if (matchMedia('(pointer: coarse)').matches || params.has('touch')) document.body.classList.add('touch');
function circleOf(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
}
function onTouch(e) {
  e.preventDefault();
  const seen = new Set();
  let buttons = 0, sx = 0, sy = 0, stick = false;
  for (const t of e.touches) {
    seen.add(t.identifier);
    let f = fingers.get(t.identifier);
    if (!f) {
      const start = document.elementFromPoint(t.clientX, t.clientY);
      const region = start && start.closest('[data-stick],[data-dpad]');
      f = region ? { kind: region.hasAttribute('data-stick') ? 'stick' : 'dpad', el: region } : { kind: 'button' };
      fingers.set(t.identifier, f);
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    }
    if (f.kind === 'stick') {
      const c = circleOf(f.el);
      let dx = (t.clientX - c.x) / c.r, dy = (t.clientY - c.y) / c.r;
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      sx = dx; sy = dy; stick = true;
      knob.style.transform = 'translate(' + (dx * c.r * 0.6) + 'px,' + (dy * c.r * 0.6) + 'px)';
    } else if (f.kind === 'dpad') {
      const d = circleOf(f.el), ox = t.clientX - d.x, oy = t.clientY - d.y;
      if (Math.hypot(ox, oy) > d.r * 0.2) {
        const angle = Math.atan2(oy, ox) * 180 / Math.PI;
        if (angle > -67.5 && angle < 67.5) buttons |= 0x20;
        if (angle > 22.5 && angle < 157.5) buttons |= 0x40;
        if (angle > 112.5 || angle < -112.5) buttons |= 0x80;
        if (angle > -157.5 && angle < -22.5) buttons |= 0x10;
      }
    } else {
      const over = document.elementFromPoint(t.clientX, t.clientY);
      const button = over && over.closest('[data-btn]');
      if (button && touchRoot.contains(button)) buttons |= Number(button.dataset.btn);
    }
  }
  for (const id of [...fingers.keys()]) if (!seen.has(id)) fingers.delete(id);
  if (!stick) knob.style.transform = '';
  touchPad = { buttons, x: sx, y: sy, stick };
  touchRoot.querySelectorAll('[data-btn]').forEach((el) => el.classList.toggle('on', (buttons & Number(el.dataset.btn)) !== 0));
  touchRoot.querySelectorAll('[data-dir]').forEach((el) => el.classList.toggle('on', (buttons & Number(el.dataset.dir)) !== 0));
}
for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) touchRoot.addEventListener(type, onTouch, { passive: false });

const scaleSelect = document.getElementById('scale');
let scale = params.get('PS2_SCALE');
if (!scale) {
  try { scale = localStorage.getItem('ps2web-scale'); } catch (e) {}
}
scale = ['1', '2', '3'].includes(scale) ? scale : '1';
scaleSelect.value = scale;
scaleSelect.addEventListener('change', () => {
  try { localStorage.setItem('ps2web-scale', scaleSelect.value); } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.delete('PS2_SCALE');
  location.href = url.href;
});

const controlsButton = document.getElementById('controls-toggle');
let hideControls = false;
try { hideControls = localStorage.getItem('ps2web-hide-controls') === '1'; } catch (e) {}
function updateControls() {
  const touch = document.body.classList.contains('touch');
  document.body.classList.toggle('hide-controls', hideControls);
  controlsButton.hidden = !touch;
  controlsButton.textContent = hideControls ? 'Show controls' : 'Hide controls';
  fitCanvas();
}
controlsButton.addEventListener('click', () => {
  hideControls = !hideControls;
  try { localStorage.setItem('ps2web-hide-controls', hideControls ? '1' : '0'); } catch (e) {}
  updateControls();
});

function fitCanvas() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
  const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    if (Module.running && Module._ps2web_resize) Module._ps2web_resize(width, height);
  }
}
window.addEventListener('resize', fitCanvas);

const fullscreenButton = document.getElementById('fullscreen');
const root = document.documentElement;
const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
const nativeFullscreen = () => document.fullscreenElement || document.webkitFullscreenElement;
let fullscreen = false;
function setFullscreen(on) {
  fullscreen = on;
  document.body.classList.toggle('fullscreen', on);
  fullscreenButton.textContent = on ? 'Exit fullscreen' : 'Fullscreen';
  fitCanvas();
}
function toggleFullscreen() {
  if (fullscreen) {
    if (nativeFullscreen() && exitFullscreen) exitFullscreen.call(document);
    setFullscreen(false);
    return;
  }
  setFullscreen(true);
  if (!requestFullscreen) return;
  const result = requestFullscreen.call(root, { navigationUI: 'hide' });
  if (result && result.then) {
    result.then(() => {
      if (document.body.classList.contains('touch') && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => {});
  }
}
function onFullscreenChange() {
  if (!nativeFullscreen() && fullscreen && requestFullscreen) setFullscreen(false);
  else fitCanvas();
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
fullscreenButton.addEventListener('click', toggleFullscreen);
document.getElementById('exit-fullscreen').addEventListener('click', toggleFullscreen);
canvas.addEventListener('dblclick', toggleFullscreen);
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyF' || e.repeat || e.target.tagName === 'SELECT') return;
  e.preventDefault();
  toggleFullscreen();
});

const workletSource = `
class Output extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const { buffer, base } = options.processorOptions;
    this.ring = new Uint32Array(buffer, base, 4);
    this.capacity = this.ring[2];
    this.samples = new Int16Array(buffer, base + 16, this.capacity * 2);
    this.left = 0;
    this.right = 0;
    this.volume = 1.0;
    this.port.onmessage = (e) => {
      if (e.data && e.data.volume !== undefined) this.volume = e.data.volume;
    };
  }
  process(inputs, outputs) {
    const left = outputs[0][0], right = outputs[0][1];
    const write = Atomics.load(this.ring, 0), mask = this.capacity - 1;
    let read = Atomics.load(this.ring, 1);
    const available = (write - read + this.capacity) & mask;
    // Compensação adaptativa: reduz acúmulo de latência se o buffer ultrapassar 70%
    if (available > ((this.capacity * 7) / 10)) {
      read = (read + 32) >>> 0;
    }
    for (let i = 0; i < left.length; ++i) {
      if (read !== write) {
        const at = (read & mask) * 2;
        this.left = (this.samples[at] / 32768) * this.volume;
        this.right = (this.samples[at + 1] / 32768) * this.volume;
        read = (read + 1) >>> 0;
      } else {
        this.left *= 0.985;
        this.right *= 0.985;
      }
      left[i] = this.left;
      right[i] = this.right;
    }
    Atomics.store(this.ring, 1, read);
    Atomics.store(this.ring, 3, 1);
    return true;
  }
}
registerProcessor('ps2-output', Output);`;

let audio = null, node = null;
async function startAudio() {
  audio = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSource], { type: 'application/javascript' })));
  node = new AudioWorkletNode(audio, 'ps2-output', {
    outputChannelCount: [2],
    processorOptions: { buffer: Module.HEAPU8.buffer, base: Module._ps2web_audio_ring() },
  });
  node.connect(audio.destination);
}

const keys = new Set();
const keyMap = { ArrowUp: 4, ArrowRight: 5, ArrowDown: 6, ArrowLeft: 7, KeyZ: 14, KeyX: 13, KeyA: 15, KeyS: 12,
                 KeyQ: 10, KeyW: 11, Digit1: 8, Digit2: 9, Enter: 3, Backspace: 0 };
const stickKeys = new Set(['KeyI', 'KeyJ', 'KeyK', 'KeyL']);
window.addEventListener('keydown', (e) => { if (e.code in keyMap || stickKeys.has(e.code)) { keys.add(e.code); e.preventDefault(); } });
window.addEventListener('keyup', (e) => { keys.delete(e.code); });
const padButtons = [[0, 14], [1, 13], [2, 15], [3, 12], [4, 10], [5, 11], [6, 8], [7, 9], [8, 0], [9, 3], [10, 1], [11, 2],
                    [12, 4], [13, 6], [14, 7], [15, 5]];
const axis = (v) => Math.max(0, Math.min(255, Math.round((v + 1) * 127.5)));
// the keyboard and touch controls are player 1 along with the first gamepad, a second gamepad is player 2
const players = [0, 1].map(() => ({ plugged: false, pad: -1, pressure: '', strong: 0, weak: 0, rumbleAt: 0 }));
const motorStrength = (v) => v < 16 ? 0 : Math.sqrt(v / 255);
function pollPlayer(port, gamepad, own) {
  const player = players[port];
  const plugged = port === 0 || !!gamepad;
  if (plugged !== player.plugged) {
    player.plugged = plugged;
    Module._ps2web_pad_connected(port, plugged ? 1 : 0);
  }
  if (!plugged) return;
  let buttons = 0, lx = 128, ly = 128, rx = 128, ry = 128;
  const pressure = new Array(16).fill(255);
  if (own) {
    buttons |= touchPad.buttons;
    for (const k of keys) if (k in keyMap) buttons |= 1 << keyMap[k];
    if (keys.has('KeyJ')) lx = 0;
    if (keys.has('KeyL')) lx = 255;
    if (keys.has('KeyI')) ly = 0;
    if (keys.has('KeyK')) ly = 255;
    if (touchPad.stick) {
      lx = axis(touchPad.x);
      ly = axis(touchPad.y);
    }
  }
  const full = buttons;
  if (gamepad) {
    for (const [index, bit] of padButtons) {
      const b = gamepad.buttons[index];
      if (!b || !(b.pressed || b.value > 0.05)) continue;
      buttons |= 1 << bit;
      if (!(full & (1 << bit))) pressure[bit] = Math.max(1, Math.round((b.value > 0 ? b.value : 1) * 255));
    }
    if (gamepad.axes.length >= 4) {
      if (lx === 128) lx = axis(gamepad.axes[0]);
      if (ly === 128) ly = axis(gamepad.axes[1]);
      rx = axis(gamepad.axes[2]);
      ry = axis(gamepad.axes[3]);
    }
  }
  const state = buttons + lx * 65536 + ly * 16777216 + rx * 4294967296 + ry * 1099511627776;
  if (state !== player.pad) {
    player.pad = state;
    Module._ps2web_pad(port, buttons, lx, ly, rx, ry);
  }
  const packed = [0, 1, 2, 3].map((i) => pressure[i * 4] | (pressure[i * 4 + 1] << 8) | (pressure[i * 4 + 2] << 16) | (pressure[i * 4 + 3] << 24));
  if (packed.join() !== player.pressure) {
    player.pressure = packed.join();
    Module._ps2web_pressure(port, packed[0], packed[1], packed[2], packed[3]);
  }
  const rumble = Module._ps2web_rumble(port), now = performance.now();
  const strong = motorStrength(rumble >> 8), weak = rumble & 1;
  const actuator = gamepad && gamepad.vibrationActuator;
  if (actuator && (Math.abs(strong - player.strong) > 0.08 || weak !== player.weak || ((strong || weak) && now - player.rumbleAt > 100))) {
    player.strong = strong;
    player.weak = weak;
    player.rumbleAt = now;
    const done = strong || weak ? actuator.playEffect('dual-rumble', { duration: 200, weakMagnitude: weak, strongMagnitude: strong }) : actuator.reset();
    if (done && done.catch) done.catch(() => {});
  }
}
function pollInput() {
  const pads = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter((pad) => pad);
  pollPlayer(0, pads[0] || null, true);
  pollPlayer(1, pads[1] || null, false);
}

// some browsers cannot show a canvas drawn by another GPU (hybrid laptops on Linux), so each adapter draws a few test frames first
async function canPresent(power) {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: power });
  if (!adapter) return null;
  const device = await adapter.requestDevice();
  let failed = false;
  device.lost.then((info) => {
    if (info.reason === 'destroyed') return;
    failed = true;
    console.warn('[gpu check] ' + power + ' device lost: ' + info.message);
  });
  device.onuncapturederror = (e) => {
    failed = true;
    console.warn('[gpu check] ' + power + ': ' + e.error.message);
  };
  const probe = document.createElement('canvas');
  probe.width = probe.height = 64;
  probe.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none';
  document.body.appendChild(probe);
  try {
    const context = probe.getContext('webgpu');
    context.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'opaque' });
    for (let i = 0; i < 3 && !failed; ++i) {
      const encoder = device.createCommandEncoder();
      encoder.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] }).end();
      device.queue.submit([encoder.finish()]);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      await device.queue.onSubmittedWorkDone();
    }
  } catch (e) {
    failed = true;
    console.warn('[gpu check] ' + power + ': ' + e);
  }
  probe.remove();
  const name = [adapter.info.vendor, adapter.info.architecture].filter(Boolean).join(' ') || power;
  device.destroy();
  return failed ? null : name;
}

function webgpuHelp(onCpu) {
  const firefox = navigator.userAgent.includes('Firefox/');
  const linux = navigator.userAgent.includes('Linux') && !navigator.userAgent.includes('Android');
  if (firefox) return 'WebGPU is turned off in this Firefox, so the game runs on the slow software renderer. Set dom.webgpu.enabled to true in about:config and reload.';
  if (linux && onCpu) return 'WebGPU runs on the CPU here, so the game is slow. Turn on chrome://flags/#enable-vulkan as well, then restart the browser.';
  if (linux) return 'WebGPU is turned off in this browser, so the game runs on the slow software renderer. Turn on chrome://flags/#enable-unsafe-webgpu and chrome://flags/#enable-vulkan, then restart the browser.';
  return 'This browser has no WebGPU, so the game runs on the slow software renderer. A current Chrome, Edge or Safari is much faster.';
}

async function chooseGpu() {
  if (!navigator.gpu) {
    Module.gpuHelp = webgpuHelp(false);
    return 'WebGPU unavailable, software renderer';
  }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) {
    Module.gpuHelp = webgpuHelp(false);
    return 'WebGPU has no adapter, software renderer';
  }
  if (adapter.info.isFallbackAdapter || adapter.info.architecture === 'swiftshader') Module.gpuHelp = webgpuHelp(true);
  if (navigator.userAgent.includes('Firefox/')) {
    Module.presentCopy = true;
    return 'Firefox, frames copied to the page';
  }
  const forced = params.get('gpu');
  if (forced !== 'low') {
    const name = await canPresent('high-performance');
    if (name) return 'GPU ' + name;
  }
  const name = await canPresent('low-power');
  if (name) {
    Module.ENV.PS2_GPU_LOW_POWER = '1';
    return 'GPU ' + name;
  }
  Module.presentCopy = true;
  return 'GPU cannot draw to the page, copying frames';
}

let frames = 0, last = performance.now(), lastGpu = 0, lastEmuIdle = 0, lastRenderIdle = 0, lastVuIdle = 0, lastInterpreted = 0;
let shown = 0, fresh = false;
const countShown = () => {
  if (fresh) ++shown;
  fresh = false;
  requestAnimationFrame(countShown);
};
requestAnimationFrame(countShown);
var Module = {
  canvas,
  arguments: ['/game/core.elf'].concat(params.has('arg') ? ['--arg', params.get('arg')] : [], params.getAll('press').flatMap((p) => p.split(',').flatMap((x) => ['--press', x]))),
  discUrl: params.get('disc') || 'disc.iso',
  stateUrl: params.get('state'),
  noSurface: params.has('nosurface'),
  noCard: params.has('nocard'),
  presentCopy: params.has('copy'),
  print: (text) => console.log(text),
  printErr: (text) => console.log(text),
  setStatus: (text) => {
    if (!text || Module.gpuInfo) return;
    const progress = text.match(/^Downloading data\.\.\. \((\d+)\/\d+\)/);
    statusEl.textContent = progress ? 'Downloading game data, ' + (Number(progress[1]) / 1048576).toFixed(1) + ' MB unpacked' : text;
  },
  onRuntimeInitialized: () => {
    const start = document.getElementById('start');
    if (missing.length) return;
    start.disabled = false;
    start.textContent = 'Start';
  },
  preRun: [() => {
    if (!Module.noCard) {
      try {
        FS.mkdir(CARD_DIR);
        FS.mount(IDBFS, {}, CARD_DIR);
        Module.addRunDependency('card');
        FS.syncfs(true, (err) => {
          if (err) console.warn('memory card: could not read browser storage', err);
          Module.removeRunDependency('card');
        });
      } catch (e) {
        console.warn('memory card: browser storage is not available', e);
      }
    }
    for (const [key, value] of params) if (key.startsWith('PS2_')) Module.ENV[key] = value;
    Module.ENV.PS2_SCALE = scale;
    Module.addRunDependency('disc');
    Promise.all([fetch(Module.discUrl, { method: 'HEAD' }), chooseGpu().catch((e) => 'GPU check failed: ' + e)]).then(([r, gpu]) => {
      Module.discSize = Number(r.headers.get('content-length')) || 0;
      Module.gpuInfo = gpu;
      if (Module.gpuHelp && !missing.length) {
        const help = document.getElementById('help');
        help.textContent = Module.gpuHelp;
        help.hidden = false;
      }
      statusEl.textContent = (Module.discSize ? 'Disc ' + (Module.discSize / 1073741824).toFixed(2) + ' GB' : 'No disc image at ' + Module.discUrl) + ', ' + gpu;
      Module.removeRunDependency('disc');
    });
  }],
  audioQueuedMs: () => Module._ps2web_audio_queued_ms(),
  ps2CardSaved: () => storeCard(),
  onFrame: () => {
    pollInput();
    ++frames;
    fresh = true;
    const now = performance.now();
    if (now - last >= 1000) {
      const gpu = Module._ps2web_gpu_ms();
      const memory = (Module.HEAPU8.length / 1048576).toFixed(0);
      const emuIdle = Module._ps2web_idle_ms(0), renderIdle = Module._ps2web_idle_ms(1), vuIdle = Module._ps2web_idle_ms(2), span = now - last;
      const interpreted = Module._ps2web_vu_interpreted();
      statsEl.textContent = 'frame ' + Module._ps2web_frames() + '   ' + (frames * 1000 / span).toFixed(1) + ' fps (' + (shown * 1000 / span).toFixed(0) + ' on screen)   GPU ' + ((gpu - lastGpu) / span * 100).toFixed(0) +
                            '%   idle emu ' + ((emuIdle - lastEmuIdle) / span * 100).toFixed(0) + '% vu ' + ((vuIdle - lastVuIdle) / span * 100).toFixed(0) +
                            '% gs ' + ((renderIdle - lastRenderIdle) / span * 100).toFixed(0) +
                            '%   heap ' + memory + ' MB   audio ' + Module.audioQueuedMs().toFixed(0) + ' ms' +
                            (interpreted > lastInterpreted ? '   vu1 interpreted ' + Math.round((interpreted - lastInterpreted) * 1000 / span) + '/s' : '');
      lastInterpreted = interpreted;
      lastEmuIdle = emuIdle;
      lastRenderIdle = renderIdle;
      lastVuIdle = vuIdle;
      lastGpu = gpu;
      frames = 0;
      shown = 0;
      last = now;
    }
  },
  noInitialRun: true,
};

updateControls();
if (missing.length) {
  const help = document.getElementById('help');
  help.textContent = 'This browser cannot run the game yet. It lacks ' + missing.join(', ') + '. A current Chrome or Edge has everything it needs.';
  help.hidden = false;
  document.getElementById('start').textContent = 'Unsupported browser';
}

document.getElementById('start').addEventListener('click', async () => {
  document.getElementById('overlay').remove();
  canvas.focus();
  fitCanvas();
  await startAudio();
  if (node && node.port) node.port.postMessage({ volume: Number(volumeSlider.value) / 100 });
  statusEl.textContent = 'Running, ' + Module.gpuInfo;
  Module.running = true;
  Module.callMain(Module.arguments);
});

// Settings Modal & Enhancement Controls
const settingsModal = document.getElementById('settings-modal');
const settingsBtn = document.getElementById('settings-btn');
const settingsClose = document.getElementById('settings-close');
const aspectSelect = document.getElementById('aspect-select');
const shaderSelect = document.getElementById('shader-select');
const volumeSlider = document.getElementById('volume-slider');
const volumeLabel = document.getElementById('volume-label');
const relaxCheck = document.getElementById('relax-misses-check');
const btnQuickSave = document.getElementById('btn-quick-save');
const btnQuickLoad = document.getElementById('btn-quick-load');
const btnPauseEmu = document.getElementById('btn-pause-emu');
const btnCompatReport = document.getElementById('btn-compat-report');

// Load stored settings
try {
  const savedAspect = localStorage.getItem('ps2web-aspect') || params.get('PS2_ASPECT') || '4:3';
  aspectSelect.value = savedAspect;
  const savedShader = localStorage.getItem('ps2web-shader') || params.get('PS2_SHADER') || 'sharp';
  shaderSelect.value = savedShader;
  const savedVol = localStorage.getItem('ps2web-volume') || '100';
  volumeSlider.value = savedVol;
  volumeLabel.textContent = savedVol + '%';
  relaxCheck.checked = localStorage.getItem('ps2web-relax') === '1' || params.has('relax');
} catch (e) {}

// Apply initial settings to Module.ENV
if (aspectSelect.value !== '4:3') Module.ENV.PS2_ASPECT = aspectSelect.value;
if (shaderSelect.value !== 'sharp') Module.ENV.PS2_SHADER = shaderSelect.value;
if (relaxCheck.checked) Module.ENV.PS2_RELAX_MISSES = '1';

settingsBtn.addEventListener('click', () => { settingsModal.hidden = false; });
settingsClose.addEventListener('click', () => { settingsModal.hidden = true; });
settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.hidden = true; });

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 3000);
}

aspectSelect.addEventListener('change', () => {
  try { localStorage.setItem('ps2web-aspect', aspectSelect.value); } catch (e) {}
  if (Module.running) {
    showToast('Aspect ratio saved. Reload page to re-render surface.');
  }
});

shaderSelect.addEventListener('change', () => {
  try { localStorage.setItem('ps2web-shader', shaderSelect.value); } catch (e) {}
  if (Module.running) {
    showToast('Shader filter saved. Reload page to apply new pipeline.');
  }
});

volumeSlider.addEventListener('input', () => {
  const val = Number(volumeSlider.value);
  volumeLabel.textContent = val + '%';
  try { localStorage.setItem('ps2web-volume', val.toString()); } catch (e) {}
  if (node && node.port) node.port.postMessage({ volume: val / 100 });
});

relaxCheck.addEventListener('change', () => {
  try { localStorage.setItem('ps2web-relax', relaxCheck.checked ? '1' : '0'); } catch (e) {}
  showToast(relaxCheck.checked ? 'Fault-tolerant miss mode enabled' : 'Strict mode enabled');
});

let isPaused = false;
btnPauseEmu.addEventListener('click', () => {
  if (!Module.running) return;
  isPaused = !isPaused;
  btnPauseEmu.textContent = isPaused ? '▶ Resume Game' : '⏸ Pause Game';
  if (audio) {
    if (isPaused) audio.suspend();
    else audio.resume();
  }
  showToast(isPaused ? 'Emulation paused' : 'Emulation resumed');
});

// Capture unhandled calls for compatibility reports
const unhandledCalls = { syscalls: new Set(), iop: new Set() };
const origWarn = console.warn, origErr = console.error, origLog = console.log;
function checkLogForCompat(str) {
  if (typeof str !== 'string') return;
  const sysMatch = str.match(/\[sys\]\s+unhandled syscall\s+(0x[0-9A-Fa-f]+)/);
  if (sysMatch) unhandledCalls.syscalls.add(sysMatch[1]);
  const iopMatch = str.match(/\[iop\]\s+missing\s+([^#\s]+)\s+#(\d+)/);
  if (iopMatch) unhandledCalls.iop.add(`${iopMatch[1]} #${iopMatch[2]}`);
}
console.log = function(...args) { checkLogForCompat(args[0]); origLog.apply(console, args); };
console.warn = function(...args) { checkLogForCompat(args[0]); origWarn.apply(console, args); };
console.error = function(...args) { checkLogForCompat(args[0]); origErr.apply(console, args); };

btnCompatReport.addEventListener('click', () => {
  const report = {
    timestamp: new Date().toISOString(),
    disc: Module.discUrl,
    gpu: Module.gpuInfo || 'unknown',
    fps: statsEl.textContent,
    missingSyscalls: Array.from(unhandledCalls.syscalls),
    missingIopModules: Array.from(unhandledCalls.iop),
  };
  const json = JSON.stringify(report, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showToast('Compatibility report copied to clipboard!');
  }).catch(() => {
    alert(json);
  });
});

// Quick Save / Load snapshot
btnQuickSave.addEventListener('click', () => {
  try {
    let cardData = null;
    try { cardData = FS.readFile(CARD_FILE); } catch (e) {}
    if (cardData) {
      const snap = { time: Date.now(), card: Array.from(cardData) };
      localStorage.setItem('ps2web-quicksave', JSON.stringify(snap));
      showToast('Quick Save State created!');
    } else {
      showToast('No save data available yet.');
    }
  } catch (e) {
    showToast('Failed to quick save: ' + e.message);
  }
});

btnQuickLoad.addEventListener('click', () => {
  try {
    const raw = localStorage.getItem('ps2web-quicksave');
    if (!raw) { showToast('No Quick Save found.'); return; }
    const snap = JSON.parse(raw);
    FS.writeFile(CARD_FILE, new Uint8Array(snap.card));
    storeCard(() => {
      showToast('Quick Save restored! Reloading...');
      setTimeout(() => location.reload(), 800);
    });
  } catch (e) {
    showToast('Failed to quick load: ' + e.message);
  }
});
